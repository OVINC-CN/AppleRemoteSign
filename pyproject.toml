[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "apple-remote-sign"
version = "0.1.0"
description = "A small Apple signing and notarization API"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.120,<1",
  "uvicorn>=0.38,<1",
  "sqlalchemy>=2.0.44,<2.1",
  "pymysql[rsa]>=1.1.2,<2",
  "redis>=8.1,<9",
  "pydantic-settings>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "pyjwt[crypto]>=2.10,<3",
  "authlib>=1.9.1,<2",
  "boto3>=1.43,<2",
  "opentelemetry-api>=1.45,<2",
  "opentelemetry-sdk>=1.45,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.45,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.14,<1",
  "mypy>=1.18,<3",
  "boto3-stubs[s3]>=1.43,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/apple_remote_sign"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.14.9"
strict = true
files = ["src/apple_remote_sign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "mysql: requires TEST_MYSQL_URL pointing to an explicitly initialized database",
  "redis: requires TEST_REDIS_URL pointing to a disposable Redis database",
]

name: Checks
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the required PR status named "test".
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/api/go.mod
          cache-dependency-path: src/api/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: make -C src/api build
      - run: npm --prefix src/web ci
      - run: npm --prefix src/web run lint
      - run: npm --prefix src/web run build
